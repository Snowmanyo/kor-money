<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊手帳 | Travel Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* ── Washi Meridian Palette ── */
            --coral: #D46050;
            --coral-dark: #B84038;
            --coral-lt: #E8A090;
            --sage: #7A9E7E;
            --sage-dark: #5A7E5E;
            --warm-gold: #C8913A;
            /* Legacy aliases — keep JS from breaking */
            --amber: #D46050;
            --amber-dark: #B84038;
            --amber-subtle: rgba(212,96,80,0.08);
            --amber-glow: rgba(212,96,80,0.14);
            --rose: #B86070;
            --teal: #D46050;
            --teal-dark: #B84038;
            --teal-light: rgba(212,96,80,0.08);
            --navy: #F3EDE3;
            --white: #F3EDE3;
            /* Surfaces */
            --bg: #FBF7F0;
            --surface: #FFFFFF;
            --surface-2: #F3EDE3;
            --border: #E2D8CC;
            --border-light: #D5C9BC;
            /* Text */
            --text-dark: #2C2420;
            --text-gray: #8C7B72;
            --text-light: #B5A898;
            /* Shadows (warm, soft) */
            --shadow: 0 2px 12px rgba(44,36,32,0.08), 0 1px 4px rgba(44,36,32,0.04);
            --shadow-lg: 0 12px 48px rgba(44,36,32,0.14), 0 4px 16px rgba(44,36,32,0.06);
            --card-shadow: 0 1px 6px rgba(44,36,32,0.07), 0 4px 18px rgba(212,96,80,0.05);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(155deg, #F5EFE4 0%, #EDE5D6 55%, #E8DECE 100%);
            padding: 22px 20px 56px;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 36px 36px;
            box-shadow: 0 4px 24px rgba(44,36,32,0.10), 0 1px 0 rgba(212,96,80,0.18);
            border-bottom: 3px solid var(--coral);
        }

        .landmarks {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            opacity: 0.12;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path fill="%23D46050" d="M0,60 L100,40 L150,50 L200,30 L250,50 L300,20 L350,40 L400,10 L450,30 L500,50 L550,40 L600,60 L650,50 L700,40 L750,50 L800,30 L850,40 L900,50 L950,60 L1000,50 L1050,40 L1100,50 L1150,60 L1200,50 L1200,120 L0,120 Z"/></svg>');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: bottom;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(212,96,80,0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .header::before {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(122,158,126,0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-title {
            color: var(--text-dark);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-project-name {
            display: inline-flex;
            align-items: center;
            margin-top: 7px;
            background: rgba(212,96,80,0.10);
            border: 1px solid rgba(212,96,80,0.22);
            color: var(--coral);
            font-size: 13px;
            font-weight: 600;
            padding: 5px 13px;
            border-radius: 20px;
            letter-spacing: 0.2px;
        }

        .header-subtitle {
            color: var(--text-light);
            font-size: 11px;
            font-weight: 400;
            margin-top: 3px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .hamburger-btn {
            width: 42px;
            height: 42px;
            background: rgba(212,96,80,0.10);
            border: 1.5px solid rgba(212,96,80,0.22);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0;
        }

        .hamburger-btn span {
            width: 18px;
            height: 2px;
            background: var(--coral);
            border-radius: 2px;
            transition: all 0.25s ease;
        }

        .hamburger-btn:hover { background: rgba(212,96,80,0.18); }
        .hamburger-btn:active { transform: scale(0.92); }

        /* ===== SIDEBAR ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(44,36,32,0.45);
            backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 85%;
            max-width: 320px;
            height: 100vh;
            background: #FDFAF5;
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto;
            box-shadow: -8px 0 48px rgba(44,36,32,0.15);
            border-radius: 24px 0 0 24px;
            border-left: 1px solid var(--border);
        }

        .sidebar.show { transform: translateX(0); }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px;
            background: linear-gradient(145deg, #EDE5D6 0%, #E6DDD0 100%);
            color: var(--text-dark);
            border-radius: 24px 0 0 0;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-close {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(212,96,80,0.10);
            border-radius: 50%;
            color: var(--coral);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .sidebar-close:hover { background: rgba(212,96,80,0.20); transform: rotate(90deg); }

        .sidebar-section {
            padding: 18px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .user-switch-sidebar {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .user-btn-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 10px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .user-btn-sidebar:hover {
            background: var(--surface-2);
            border-color: var(--amber);
        }

        .user-btn-sidebar.active {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            border-color: transparent;
            color: #FFFFFF;
            box-shadow: 0 4px 16px rgba(212,96,80,0.30);
        }

        .sidebar-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 8px;
            text-align: left;
        }

        .sidebar-menu-item:hover {
            background: var(--surface-2);
            border-color: rgba(212,96,80,0.28);
            transform: translateX(3px);
        }

        .sidebar-item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .sidebar-item-desc {
            font-size: 11px;
            color: var(--text-gray);
        }

        .sidebar-footer { padding: 20px; margin-top: auto; }

        /* ===== 行程列表 ===== */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .project-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            border-left: 4px solid transparent;
            position: relative;
        }

        .project-item:hover {
            background: var(--surface-2);
            border-color: rgba(212,96,80,0.28);
            transform: translateX(2px);
        }

        .project-item.active {
            background: rgba(212,96,80,0.07);
            border-color: rgba(212,96,80,0.32);
            font-weight: 700;
        }

        .project-emoji { font-size: 22px; flex-shrink: 0; }

        .project-info { flex: 1; min-width: 0; }

        .project-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-date { font-size: 11px; color: var(--text-gray); margin-top: 2px; }

        .project-edit-btn {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            background: rgba(212,96,80,0.07);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .project-edit-btn:hover {
            background: var(--coral);
            color: #FFFFFF;
            border-color: transparent;
        }

        .add-project-btn {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed var(--border-light);
            background: transparent;
            border-radius: 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            transition: all 0.25s;
            margin-top: 4px;
        }

        .add-project-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-subtle);
        }

        /* ===== TABS ===== */
        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 5px;
            margin: -30px 16px 0;
            position: relative;
            z-index: 2;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(44,36,32,0.10), 0 1px 4px rgba(44,36,32,0.06), 0 0 0 1px rgba(212,96,80,0.08);
        }

        .tab {
            padding: 12px 6px;
            background: transparent;
            border: none;
            border-radius: 15px;
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.2px;
        }

        .tab:hover:not(.active) {
            background: rgba(212,96,80,0.07);
            color: var(--coral);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            color: #FFFFFF;
            box-shadow: 0 3px 12px rgba(212,96,80,0.35);
            font-weight: 800;
        }

        /* ===== CONTENT ===== */
        .content {
            background: var(--bg);
            min-height: calc(100vh - 200px);
            padding: 18px 16px;
            margin-top: 12px;
        }

        .tab-content { display: none; }

        .tab-content.active {
            display: block;
            animation: fadeInUp 0.26s ease;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            margin-bottom: 14px;
            animation: fadeInUp 0.26s ease;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== FORMS ===== */
        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-gray);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="datetime-local"],
        textarea,
        select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.22s ease;
            background: var(--surface-2);
            color: var(--text-dark);
        }

        input::placeholder, textarea::placeholder { color: var(--text-light); }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--coral);
            background: #FFF8F6;
            box-shadow: 0 0 0 3px rgba(212,96,80,0.10);
        }

        select option { background: var(--surface-2); color: var(--text-dark); }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 18px rgba(212,96,80,0.32);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 26px rgba(212,96,80,0.42);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(212,96,80,0.22);
        }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--coral);
            border: 1.5px solid rgba(212,96,80,0.30);
        }

        .btn-secondary:hover {
            background: var(--amber-subtle);
            border-color: var(--coral);
        }

        /* ===== CATEGORY BUTTONS ===== */
        .category-grid-horizontal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .category-option { position: relative; }
        .category-option input { display: none; }

        .category-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 62px;
        }

        .category-option label:hover {
            border-color: var(--amber);
            background: var(--amber-subtle);
        }

        .category-option input:checked + label {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(212,96,80,0.35);
            transform: scale(1.06);
        }

        .category-option input:checked + label .category-name { color: #FFFFFF; }

        .category-icon { font-size: 22px; margin-bottom: 3px; line-height: 1; }

        .category-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dark);
            transition: color 0.2s;
        }

        /* ===== CURRENCY / AMOUNT ===== */
        .currency-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .currency-item {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            position: relative;
            transition: all 0.2s;
        }

        .currency-item:focus-within {
            border-color: var(--coral);
            background: #FFF8F6;
            box-shadow: 0 0 0 3px rgba(212,96,80,0.08);
        }

        .currency-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .currency-input { display: flex; align-items: center; gap: 6px; }

        .currency-symbol { font-size: 18px; font-weight: 800; color: var(--amber-dark); }

        .currency-input input {
            border: none;
            background: transparent;
            font-size: 22px;
            font-weight: 800;
            padding: 0;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        /* ===== CALCULATOR ===== */
        .calculator {
            position: absolute;
            top: 100%;
            right: 0;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(44,36,32,0.14);
            padding: 14px;
            z-index: 100;
            width: 210px;
            display: none;
            margin-top: 8px;
        }

        .calculator.show { display: block; animation: slideDown 0.2s ease; }

        .calc-display {
            background: var(--surface-2);
            padding: 12px;
            border-radius: 12px;
            text-align: right;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            min-height: 44px;
            word-break: break-all;
            color: var(--coral);
            border: 1px solid var(--border);
        }

        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .calc-btn {
            padding: 12px;
            border: none;
            background: var(--surface-2);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-dark);
        }

        .calc-btn:hover { background: rgba(212,96,80,0.10); color: var(--coral); }
        .calc-btn:active { transform: scale(0.92); }
        .calc-btn.operator { background: rgba(212,96,80,0.08); color: var(--coral); }
        .calc-btn.equals { background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%); color: #FFFFFF; }
        .calc-btn.clear { background: rgba(180,80,100,0.12); color: var(--rose); }

        .calc-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: all 0.2s;
            color: var(--text-light);
        }

        .calc-icon-btn:hover { transform: scale(1.2); color: var(--amber); }

        /* ===== STATS CARD ===== */
        .stats-card {
            background: linear-gradient(150deg, #EDE5D6 0%, #E8DECE 55%, #E2D8C8 100%);
            border-radius: 24px;
            padding: 22px;
            color: var(--text-dark);
            box-shadow: 0 4px 20px rgba(44,36,32,0.10), 0 0 0 1px rgba(212,96,80,0.12);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212,96,80,0.14);
        }

        .stats-card::before {
            content: '₩';
            position: absolute;
            right: -16px;
            top: -24px;
            font-size: 110px;
            opacity: 0.06;
            font-weight: 800;
            color: var(--coral);
        }

        .stats-card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(122,158,126,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .stats-title {
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .stat-item {
            background: rgba(255,255,255,0.55);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(212,96,80,0.12);
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.65;
            margin-bottom: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== PAYMENT ===== */
        .payment-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .payment-option { position: relative; }
        .payment-option input { display: none; }

        .payment-option label {
            display: block;
            padding: 11px 6px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .payment-option label:hover { border-color: var(--amber); background: var(--amber-subtle); }

        .payment-option input:checked + label {
            background: var(--amber-subtle);
            border-color: var(--coral);
            color: var(--coral);
            box-shadow: 0 2px 8px rgba(212,96,80,0.16);
        }

        /* ===== SPLIT TOGGLE ===== */
        .split-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .split-toggle:hover { border-color: var(--amber); background: var(--amber-subtle); }

        .switch { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
        .switch input { display: none; }

        .slider {
            position: absolute;
            inset: 0;
            background: #D5C9BC;
            border-radius: 28px;
            transition: all 0.3s;
        }

        .slider:before {
            content: '';
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: #FFFFFF;
            border-radius: 50%;
            transition: all 0.3s;
            box-shadow: 0 1px 4px rgba(44,36,32,0.20);
        }

        .switch input:checked + .slider { background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%); }
        .switch input:checked + .slider:before { transform: translateX(24px); background: #FFFFFF; }

        .split-mode { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
        .split-mode-option { position: relative; }
        .split-mode-option input { display: none; }

        .split-mode-option label {
            display: block;
            padding: 12px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .split-mode-option label:hover { border-color: var(--amber); background: var(--amber-subtle); }
        .split-mode-option input:checked + label { background: var(--amber-subtle); border-color: var(--coral); color: var(--coral); }

        .split-people { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }

        .person-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            background: rgba(212,96,80,0.10);
            border: 1px solid rgba(212,96,80,0.20);
            border-radius: 20px;
            font-size: 13px;
            color: var(--coral);
            font-weight: 700;
            animation: bounceIn 0.3s ease;
        }

        .person-tag button {
            background: none; border: none;
            color: var(--coral); cursor: pointer;
            font-size: 14px; padding: 0;
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }

        .person-tag button:hover { background: var(--coral); color: #FFFFFF; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            65% { opacity: 1; transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state { text-align: center; padding: 56px 20px; }
        .empty-icon { font-size: 58px; margin-bottom: 12px; opacity: 0.35; }
        .empty-text { font-size: 15px; font-weight: 600; color: var(--text-gray); }

        /* ===== EXPENSE CARDS ===== */
        .expense-card {
            background: var(--surface);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--coral);
            transition: all 0.22s ease;
            animation: fadeInUp 0.22s ease;
        }

        .expense-card:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(44,36,32,0.08), 0 6px 20px rgba(212,96,80,0.08);
            border-color: rgba(212,96,80,0.28);
            border-left-color: var(--coral);
        }

        .expense-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .expense-title { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--text-dark); }
        .expense-date { font-size: 11px; color: var(--text-light); font-weight: 500; }

        .expense-amounts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .amount-item { font-size: 14px; }

        .amount-label {
            color: var(--text-light);
            font-size: 10px;
            margin-bottom: 3px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .amount-value { font-size: 18px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.3px; }

        .expense-menu { position: relative; }

        .expense-menu-btn {
            width: 30px; height: 30px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 8px; font-size: 16px;
            cursor: pointer; transition: all 0.2s;
            color: var(--text-gray);
        }

        .expense-menu-btn:hover { background: var(--amber-subtle); color: var(--coral); border-color: rgba(212,96,80,0.28); }

        .expense-dropdown {
            position: absolute; right: 0; top: 100%; margin-top: 6px;
            background: #FFFFFF; border-radius: 14px;
            box-shadow: 0 8px 40px rgba(44,36,32,0.14);
            border: 1px solid var(--border);
            min-width: 130px; overflow: hidden;
            opacity: 0; pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: all 0.2s ease; z-index: 10;
        }

        .expense-dropdown.show { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }

        .expense-dropdown button {
            width: 100%; padding: 11px 15px; border: none;
            background: none; text-align: left; cursor: pointer;
            font-size: 13px; font-weight: 500; color: var(--text-dark);
            transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif;
        }

        .expense-dropdown button:hover { background: var(--amber-subtle); color: var(--coral); }
        .expense-dropdown button:not(:last-child) { border-bottom: 1px solid var(--border); }

        /* ===== BADGES ===== */
        .settled-badge {
            display: inline-block; padding: 3px 9px;
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            color: #FFFFFF; border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px;
        }

        .proxy-badge {
            display: inline-block; padding: 3px 9px;
            background: rgba(212,115,107,0.15); color: var(--rose);
            border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px;
            border: 1px solid rgba(212,115,107,0.25);
        }

        /* ===== IMAGE UPLOAD ===== */
        .image-upload-area { cursor: pointer; }

        .image-preview {
            width: 100%; height: 180px;
            border: 1.5px dashed var(--border-light); border-radius: 18px;
            overflow: hidden; background: var(--surface-2); transition: all 0.25s;
        }

        .image-preview:hover { border-color: var(--amber); background: var(--amber-subtle); }

        .upload-placeholder {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-light); gap: 8px; font-weight: 500; font-size: 14px;
        }

        .image-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* ===== SHOPPING CARDS ===== */
        .shopping-card {
            background: var(--surface); border-radius: 18px; overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: all 0.22s; animation: fadeInUp 0.22s ease;
        }

        .shopping-card.purchased { opacity: 0.5; }

        .shopping-image { width: 100%; height: 160px; object-fit: cover; background: var(--surface-2); }

        .shopping-content { padding: 14px 16px; }

        .shopping-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }

        .shopping-title { font-size: 15px; font-weight: 700; color: var(--text-dark); flex: 1; }
        .shopping-title.purchased { text-decoration: line-through; color: var(--text-light); }

        .shopping-info { font-size: 12px; color: var(--text-gray); margin-bottom: 7px; font-weight: 500; }

        .shopping-prices { display: flex; gap: 12px; margin-bottom: 10px; font-size: 14px; color: var(--text-dark); font-weight: 700; }

        .shopping-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 7px; }

        .btn-purchase {
            padding: 10px; border: 1.5px solid rgba(212,96,80,0.30);
            background: var(--surface-2); color: var(--coral);
            border-radius: 12px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .btn-purchase:hover { background: var(--amber-subtle); border-color: var(--coral); }

        .btn-purchase.purchased {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            color: #FFFFFF; border-color: transparent;
        }

        .btn-icon {
            width: 40px; height: 40px;
            border: 1px solid var(--border);
            background: var(--surface-2); border-radius: 12px;
            cursor: pointer; font-size: 16px; transition: all 0.22s;
            color: var(--text-gray);
        }

        .btn-icon:hover { background: rgba(212,115,107,0.14); color: var(--rose); border-color: rgba(212,115,107,0.24); }
        .btn-icon.edit:hover { background: var(--amber-subtle); color: var(--coral); border-color: rgba(212,96,80,0.28); }

        /* ===== QUANTITY ===== */
        .shopping-quantity {
            background: var(--surface-2); padding: 12px;
            border-radius: 12px; margin: 10px 0; border: 1px solid var(--border);
        }

        .qty-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-dark); }

        .qty-badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(212,115,107,0.14); color: var(--rose); border: 1px solid rgba(212,115,107,0.2); }
        .qty-badge.complete { background: rgba(126,194,127,0.14); color: #7EC27F; border-color: rgba(126,194,127,0.2); }

        .qty-progress { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }

        .qty-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--coral) 0%, var(--coral-lt) 100%);
            transition: width 0.35s; border-radius: 3px;
        }

        .qty-actions { display: flex; justify-content: center; align-items: center; gap: 16px; }

        .qty-btn {
            width: 30px; height: 30px;
            border: 1.5px solid rgba(212,96,80,0.30);
            background: var(--surface);
            border-radius: 8px; color: var(--coral);
            font-size: 16px; font-weight: 800; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }

        .qty-btn:hover { background: var(--coral); color: #FFFFFF; border-color: var(--coral); }
        .qty-btn:active { transform: scale(0.9); }
        .qty-actions > span { font-size: 16px; font-weight: 800; color: var(--text-dark); min-width: 28px; text-align: center; }

        /* ===== FILTERS ===== */
        .filter-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .filter-tabs::-webkit-scrollbar { height: 3px; }
        .filter-tabs::-webkit-scrollbar-track { background: transparent; }
        .filter-tabs::-webkit-scrollbar-thumb { background: rgba(212,96,80,0.25); border-radius: 2px; }

        .filter-tab {
            padding: 9px 14px; border: 1.5px solid var(--border);
            background: var(--surface-2); border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; color: var(--text-dark);
            white-space: nowrap; flex-shrink: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .filter-tab.active {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
            color: #FFFFFF; border-color: transparent;
            box-shadow: 0 3px 10px rgba(212,96,80,0.25);
        }

        .filter-options { display: flex; gap: 7px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }

        .filter-option-btn {
            padding: 9px 14px; border: 1.5px solid var(--border);
            background: var(--surface-2); border-radius: 10px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: center;
            white-space: nowrap; flex-shrink: 0;
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--text-dark);
        }

        .filter-option-btn:hover,
        .filter-option-btn.active { background: var(--amber-subtle); border-color: var(--amber); color: var(--amber); }

        .btn-filter-clear {
            padding: 7px 14px; border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 8px; font-size: 12px; font-weight: 700;
            color: var(--text-gray); cursor: pointer; transition: all 0.2s;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .btn-filter-clear:hover { background: var(--surface); color: var(--text-dark); }

        .location-filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }

        .location-btn {
            padding: 11px; border: 1.5px solid var(--border);
            background: var(--surface-2); border-radius: 12px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: left;
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--text-dark);
        }

        .location-btn:hover,
        .location-btn.active { background: var(--amber-subtle); border-color: var(--amber); color: var(--amber); }

        /* ===== SPLIT CARDS ===== */
        .split-card {
            background: linear-gradient(135deg, rgba(212,96,80,0.05) 0%, rgba(212,96,80,0.02) 100%);
            border-radius: 18px; padding: 18px; margin-bottom: 12px;
            border: 1px solid rgba(212,96,80,0.16);
            border-left: 4px solid var(--coral);
            box-shadow: 0 2px 10px rgba(44,36,32,0.06);
        }

        .split-person-name { font-size: 17px; font-weight: 800; color: var(--text-dark); margin-bottom: 14px; }
        .split-stats { display: grid; gap: 7px; margin-bottom: 10px; }
        .split-stat-row { display: flex; justify-content: space-between; font-size: 13px; }
        .split-stat-label { color: var(--text-gray); font-weight: 500; }
        .split-stat-value { font-weight: 700; color: var(--text-dark); }
        .split-details { margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(212,96,80,0.25); }
        .split-detail-title { font-size: 11px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .split-item { font-size: 12px; color: var(--text-dark); margin-bottom: 5px; padding-left: 8px; font-weight: 500; }

        /* ===== EDIT MODAL ===== */
        .edit-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(44,36,32,0.50);
            backdrop-filter: blur(6px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .edit-modal-overlay.show { display: flex; }

        .edit-modal {
            background: #FFFFFF;
            border-radius: 24px;
            width: 92%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(44,36,32,0.18), 0 0 0 1px rgba(212,96,80,0.10);
            animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
            border: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .edit-modal-header {
            padding: 22px 24px;
            background: linear-gradient(145deg, #EDE5D6 0%, #E6DDD0 100%);
            color: var(--text-dark);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .edit-modal-title { font-size: 18px; font-weight: 800; }

        .edit-modal-close {
            width: 34px; height: 34px; border: none;
            background: rgba(212,96,80,0.10); border-radius: 50%;
            color: var(--coral); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s;
        }

        .edit-modal-close:hover { background: rgba(212,96,80,0.20); transform: rotate(90deg); }

        .edit-modal-body { padding: 22px 24px; }

        .edit-modal-footer {
            padding: 18px 24px;
            background: var(--surface-2);
            border-radius: 0 0 24px 24px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
        }

        .edit-modal-footer .btn { flex: 1; }

        /* ===== CATEGORY STATS ===== */
        #categoryStats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 100%;
        }

        #categoryStats > div:nth-child(5),
        #categoryStats > div:nth-child(6),
        #categoryStats > div:nth-child(7) { grid-column: span 1; }

        #categoryStats::-webkit-scrollbar { height: 5px; }
        #categoryStats::-webkit-scrollbar-track { background: var(--border); border-radius: 3px; }
        #categoryStats::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部 -->
        <div class="header">
            <div class="landmarks"></div>
            <div class="header-content">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div class="header-title">
                            ✈️ 旅遊手帳
                        </div>
                        <div class="header-project-name" id="headerProjectName">載入中...</div>
                        <div class="header-subtitle">Travel Expense Tracker</div>
                    </div>
                    <button class="hamburger-btn" onclick="toggleSidebar()">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 標籤頁 -->
        <div class="tabs">
            <button class="tab active" data-tab="expense">記帳</button>
            <button class="tab" data-tab="shopping">購物</button>
            <button class="tab" data-tab="overview">總覽</button>
            <button class="tab" data-tab="split">分帳</button>
        </div>

        <!-- 內容區 -->
        <div class="content">
            <!-- 記帳頁面 -->
            <div class="tab-content active" id="expenseTab">
                <div class="card">
                    <div class="card-title">✍️ <span id="formModeTitle">新增記帳</span></div>
                    
                    <div class="form-group">
                        <label class="form-label">日期時間</label>
                        <input type="datetime-local" id="datetime">
                    </div>

                    <div class="form-group">
                        <label class="form-label">項目名稱</label>
                        <input type="text" id="itemName" placeholder="例如:明洞美妝店">
                    </div>

                    <div class="form-group">
                        <label class="form-label">分類</label>
                        <div class="category-grid-horizontal">
                            <div class="category-option">
                                <input type="radio" name="category" value="食" id="cat-food" checked>
                                <label for="cat-food">
                                    <div class="category-icon">🍽️</div>
                                    <div class="category-name">食</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="衣" id="cat-cloth">
                                <label for="cat-cloth">
                                    <div class="category-icon">👕</div>
                                    <div class="category-name">衣</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="住" id="cat-hotel">
                                <label for="cat-hotel">
                                    <div class="category-icon">🏨</div>
                                    <div class="category-name">住</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="行" id="cat-trans">
                                <label for="cat-trans">
                                    <div class="category-icon">🚇</div>
                                    <div class="category-name">行</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="樂" id="cat-fun">
                                <label for="cat-fun">
                                    <div class="category-icon">🎪</div>
                                    <div class="category-name">樂</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="儲值" id="cat-topup">
                                <label for="cat-topup">
                                    <div class="category-icon">💰</div>
                                    <div class="category-name">儲值</div>
                                </label>
                            </div>
                            <div class="category-option">
                                <input type="radio" name="category" value="其他" id="cat-other">
                                <label for="cat-other">
                                    <div class="category-icon">📦</div>
                                    <div class="category-name">其他</div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">金額</label>
                        <div class="currency-grid">
                            <div class="currency-item">
                                <div class="currency-label">
                                    韓元 KRW
                                    <button type="button" class="calc-icon-btn" onclick="toggleCalculator('krw')">🧮</button>
                                </div>
                                <div class="currency-input">
                                    <span class="currency-symbol">₩</span>
                                    <input type="number" id="krw" placeholder="0">
                                </div>
                                <div class="calculator" id="calc-krw">
                                    <div class="calc-display" id="calc-display-krw">0</div>
                                    <div class="calc-buttons">
                                        <button class="calc-btn" onclick="calcInput('krw', '7')">7</button>
                                        <button class="calc-btn" onclick="calcInput('krw', '8')">8</button>

    <script>
        // ========== 全域變數 ==========
        const API_URL = 'https://script.google.com/macros/s/AKfycbwg73REqKMTqtaBXs-IlAmKXkpx1qOv0l5mMiXNSAk9ZiOjiip8CE8g1yKcAYGLzlvO/exec';

        let currentUser = localStorage.getItem('currentUser') || 'Chi';
        let expenses = [];
        let exchangeRate = 0.024; // 1 KRW = ? TWD
        let splitPeople = [];
        let splitAllocations = {}; // { [name]: { krw: number, twd: number } }
        let shoppingList = [];
        let currentImageData = null;
        let currentExpenseFilter = null;
        let currentShoppingFilter = null;
        let isSyncing = false;
        let editingExpenseId = null;
        let editingShoppingId = null;

        // ===== 行程（專案）狀態 =====
        let projects = [];
        let currentProject = null;
        let _selectedProjectColor = '#4DB8AC';

        // ========== 計算機功能 ==========
        
        let calcState = {
            krw: { display: '0' },
            twd: { display: '0' }
        };

        function toggleCalculator(currency) {
            const calc = document.getElementById(`calc-${currency}`);
            const allCalcs = document.querySelectorAll('.calculator');
            
            allCalcs.forEach(c => {
                if (c.id !== `calc-${currency}`) c.classList.remove('show');
            });
            
            calc.classList.toggle('show');
            
            if (calc.classList.contains('show')) {
                calcClear(currency);
            }
        }

        function calcInput(currency, value) {
            const state = calcState[currency];
            
            if (state.display === '0') {
                state.display = value;
            } else {
                state.display += value;
            }
            
            document.getElementById(`calc-display-${currency}`).textContent = state.display;
        }

        function calcClear(currency) {
            calcState[currency] = { display: '0' };
            document.getElementById(`calc-display-${currency}`).textContent = '0';
        }

        function calcEquals(currency) {
            const state = calcState[currency];
            try {
                const result = eval(state.display);
                const roundedResult = Math.round(result);
                state.display = String(roundedResult);
                document.getElementById(`calc-display-${currency}`).textContent = roundedResult;
                
                document.getElementById(currency).value = roundedResult;
                
                setTimeout(() => {
                    document.getElementById(`calc-${currency}`).classList.remove('show');
                }, 500);
            } catch (e) {
                state.display = 'Error';
                document.getElementById(`calc-display-${currency}`).textContent = 'Error';
                setTimeout(() => {
                    calcClear(currency);
                }, 1000);
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.currency-item') && !e.target.closest('.calculator')) {
                document.querySelectorAll('.calculator').forEach(calc => {
                    calc.classList.remove('show');
                });
            }
            
            if (!e.target.closest('.expense-menu')) {
                document.querySelectorAll('.expense-dropdown').forEach(m => m.classList.remove('show'));
            }
        });

        // ========== 使用者切換 ==========
        
        function switchUser(userName) {
            if (currentUser === userName) {
                closeSidebar();
                return;
            }
            
            saveToStorage();
            saveShopping();
            
            currentUser = userName;
            localStorage.setItem('currentUser', userName);
            
            document.getElementById('sidebarUserName').textContent = userName;
            
            document.querySelectorAll('.user-btn-sidebar').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.user === userName);
            });
            
            loadExpenses();
            loadShopping();
            
            renderExpenses();
            renderShopping();
            updateLocationFilters();
            
            showToast(`切換到 ${userName} 的記帳本`);
            
            closeSidebar();
        }

        // ========== 側邊欄功能 ==========
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        }

        // ========== 雲端同步功能 ==========
        
        async function uploadToCloud() {
            if (isSyncing) return;
            
            isSyncing = true;
            showSyncStatus(`上傳 ${currentUser} 的資料中...`, 'uploading');
            
            try {
                const shoppingForCloud = shoppingList.map(item => ({
                    ...item,
                    image: item.image ? '有圖片' : null
                }));
                
                // ✅ 確保 expenses 包含完整的分帳資料
                const expensesForCloud = expenses.map(exp => ({
                    ...exp,
                    // 確保這些欄位都有被序列化
                    splitAllocations: exp.splitAllocations || {},
                    splitMode: exp.splitMode || 'split',
                    splitMethod: exp.splitMethod || 'equal',
                    splitPeople: exp.splitPeople || []
                }));
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'syncAll',
                        userId: currentUser,
                        projectName: currentProject ? currentProject.name : '預設行程',
                        expenses: expensesForCloud,
                        shopping: shoppingForCloud
                    })
                });
                
                showSyncStatus(`✅ ${currentUser} 的資料上傳成功!`, 'success');
                
            } catch (error) {
                console.error('上傳失敗:', error);
                showSyncStatus('❌ 上傳失敗', 'error');
            } finally {
                isSyncing = false;
            }
        }

        async function downloadFromCloud() {
            if (isSyncing) return;
            
            isSyncing = true;
            showSyncStatus(`下載 ${currentUser} 的資料中...`, 'downloading');
            
            try {
                const projectName = currentProject ? encodeURIComponent(currentProject.name) : encodeURIComponent('預設行程');
                const response = await fetch(API_URL + `?action=getAll&userId=${currentUser}&projectName=${projectName}`, {
                    method: 'GET',
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const localImages = {};
                    shoppingList.forEach(item => {
                        if (item.image && item.image !== '有圖片') {
                            localImages[item.id] = item.image;
                        }
                    });
                    
                    // ✅ 還原 expenses 時確保分帳資料完整
                    expenses = (data.expenses || []).map(exp => ({
                        ...exp,
                        splitAllocations: exp.splitAllocations || {},
                        splitMode: exp.splitMode || 'split',
                        splitMethod: exp.splitMethod || 'equal',
                        splitPeople: exp.splitPeople || [],
                        split: exp.split || false
                    }));
                    
                    shoppingList = (data.shopping || []).map(item => ({
                        ...item,
                        image: localImages[item.id] || null
                    }));
                    
                    saveToStorage();
                    saveShopping();
                    
                    renderExpenses();
                    renderShopping();
                    updateLocationFilters();
                    
                    showSyncStatus(`✅ ${currentUser} 的資料下載成功! (${expenses.length}筆記帳, ${shoppingList.length}項購物)`, 'success');
                } else {
                    showSyncStatus('❌ 下載失敗: ' + data.message, 'error');
                }
                
            } catch (error) {
                console.error('下載失敗:', error);
                showSyncStatus('❌ 下載失敗', 'error');
            } finally {
                isSyncing = false;
            }
        }
        
        function showSyncStatus(message, type) {
            const oldStatus = document.getElementById('syncStatus');
            if (oldStatus) oldStatus.remove();
            
            const status = document.createElement('div');
            status.id = 'syncStatus';
            status.style.cssText = `
                position: fixed;
                top: 80px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                border-radius: 50px;
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 4px 16px rgba(44,36,32,0.14);
                z-index: 10000;
                animation: slideDown 0.3s ease;
                white-space: nowrap;
            `;
            
            if (type === 'uploading' || type === 'downloading') {
                status.style.background = 'var(--teal)';
                status.style.color = 'white';
                status.innerHTML = `
                    <span style="display: inline-block; animation: spin 1s linear infinite;">⟳</span>
                    ${message}
                `;
            } else if (type === 'success') {
                status.style.background = '#4CAF50';
                status.style.color = 'white';
                status.textContent = message;
            } else if (type === 'error') {
                status.style.background = '#E74C3C';
                status.style.color = 'white';
                status.textContent = message;
            }
            
            document.body.appendChild(status);
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    status.remove();
                }, 3000);
            }
        }

        // ========== 記帳功能 ==========
        
        function toggleSplit() {
            const checkbox = document.getElementById('enableSplit');
            checkbox.checked = !checkbox.checked;
            document.getElementById('splitContent').style.display = checkbox.checked ? 'block' : 'none';
            
            if (checkbox.checked && splitPeople.length === 0) {
                const otherPerson = currentUser === 'Chi' ? 'Jhen' : 'Chi';
                splitPeople.push(otherPerson);
                ensureAllocation(otherPerson);
                renderSplitPeople();
                renderSplitAllocations();
                updateSplitPreview();

            }

        function handleSplitModeChange() {
            renderSplitAllocations();
            updateSplitPreview();
        }
        
        function getSplitModeFromSelect() {
            const selectValue = document.getElementById('splitModeSelect').value;
            
            if (selectValue === 'split-equal') {
                return { mainMode: 'split', splitMethod: 'equal' };
            } else if (selectValue === 'split-custom') {
                return { mainMode: 'split', splitMethod: 'custom' };
            } else if (selectValue === 'proxy') {
                return { mainMode: 'proxy', splitMethod: 'custom' };
            }
            
            return { mainMode: 'split', splitMethod: 'equal' };
        }

        function getMyShareFromCurrentInput() {
            const totalKRW = Number(document.getElementById('krw').value) || 0;
            const totalTWD = Number(document.getElementById('twd').value) || 0;

            const enabled = document.getElementById('enableSplit').checked;
            if (!enabled || splitPeople.length === 0) {
                return { myKRW: totalKRW, myTWD: totalTWD, otherKRW: 0, otherTWD: 0 };
            }

            const { mainMode, splitMethod } = getSplitModeFromSelect();

            if (mainMode === 'split' && splitMethod === 'equal') {
                const denom = splitPeople.length + 1;
                const myKRW = denom > 0 ? totalKRW / denom : 0;
                const myTWD = denom > 0 ? totalTWD / denom : 0;
                const otherKRW = totalKRW - myKRW;
                const otherTWD = totalTWD - myTWD;
                return { myKRW, myTWD, otherKRW, otherTWD };
            }

    // proxy 或 split+custom：用每人輸入金額加總
    let otherKRW = 0;
    let otherTWD = 0;
    splitPeople.forEach(p => {
        const a = splitAllocations[p] || { krw: 0, twd: 0 };
        otherKRW += Number(a.krw) || 0;
        otherTWD += Number(a.twd) || 0;
    });

    // ✅ 防呆：對方合計不能超過總額（超過就視覺提醒，但不硬改）
    const myKRW = totalKRW - otherKRW;
    const myTWD = totalTWD - otherTWD;

    return { myKRW, myTWD, otherKRW, otherTWD };
}

    function updateSplitPreview() {
        const preview = document.getElementById('splitPreview');
        if (!preview) return;

        const enabled = document.getElementById('enableSplit').checked;

        if (!enabled) {
            preview.innerHTML = '';
            return;
        }

        if (splitPeople.length === 0) {
            preview.innerHTML = '👥 請先新增分帳/代購對象';
            return;
        }

        const { mainMode, splitMethod } = getSplitModeFromSelect();

        const totalKRW = Number(document.getElementById('krw').value) || 0;
        const totalTWD = Number(document.getElementById('twd').value) || 0;

        const { myKRW, myTWD, otherKRW, otherTWD } = getMyShareFromCurrentInput();

        const overKRW = myKRW < 0;
        const overTWD = myTWD < 0;

        const title = (mainMode === 'proxy') ? '🎁 代購' : (splitMethod === 'equal' ? '👥 分帳・平分' : '👥 分帳・自訂');

        preview.innerHTML = `
        ✅ ${title}<br>
        總額：₩${Math.round(totalKRW).toLocaleString()} / NT$${Math.round(totalTWD).toLocaleString()}<br>
        對方合計：₩${Math.round(otherKRW).toLocaleString()} / NT$${Math.round(otherTWD).toLocaleString()}<br>
        <b style="color:${(overKRW || overTWD) ? '#E74C3C' : 'var(--text-dark)'}">
            你負擔：₩${Math.round(myKRW).toLocaleString()} / NT$${Math.round(myTWD).toLocaleString()}
        </b>
        ${(overKRW || overTWD) ? `<div style="margin-top:6px; color:#E74C3C;">⚠️ 對方合計不能超過總額</div>` : ''}
        `;
    }


        function addPerson() {
            const input = document.getElementById('personName');
            const name = input.value.trim();
            
            if (name && !splitPeople.includes(name)) {
                splitPeople.push(name);
                ensureAllocation(name);
                renderSplitAllocations();
                updateSplitPreview();
                renderSplitPeople();
                input.value = '';
            }
        }

        function removePerson(name) {
            splitPeople = splitPeople.filter(p => p !== name);
            delete splitAllocations[name];
            renderSplitAllocations();
            updateSplitPreview();
            renderSplitPeople();
        }

        function renderSplitPeople() {
            const container = document.getElementById('splitPeople');
            container.innerHTML = splitPeople.map(name => `
                <div class="person-tag">
                    ${name}
                    <button onclick="removePerson('${name}')">×</button>
                </div>
            `).join('');
        }

        function ensureAllocation(name) {
                if (!splitAllocations[name]) {
                    splitAllocations[name] = { krw: 0, twd: 0 };
                }
            }

            function renderSplitAllocations() {
                const wrap = document.getElementById('splitAllocationsWrap');
                const container = document.getElementById('splitAllocations');

                if (!wrap || !container) return;

                const enabled = document.getElementById('enableSplit').checked;
                if (!enabled || splitPeople.length === 0) {
                    wrap.style.display = 'none';
                    container.innerHTML = '';
                    return;
                }

                const { mainMode, splitMethod } = getSplitModeFromSelect();

                // ✅ 代購一定要能填「每人不同金額」；分帳只有 custom 才需要每人輸入
                const shouldShow = (mainMode === 'proxy') || (mainMode === 'split' && splitMethod === 'custom');
                wrap.style.display = shouldShow ? 'block' : 'none';

                if (!shouldShow) {
                    container.innerHTML = '';
                    return;
                }

                // 確保每個人都有 allocation
                splitPeople.forEach(ensureAllocation);

                container.innerHTML = splitPeople.map(name => {
                    const a = splitAllocations[name] || { krw: 0, twd: 0 };
                    return `
                    <div class="currency-item" style="margin-bottom: 10px;">
                        <div class="currency-label">👤 ${name} 應付</div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="currency-input" style="background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px;">
                            <span class="currency-symbol">₩</span>
                            <input type="number" value="${a.krw || 0}" min="0"
                            style="border:none; background:transparent; width:100%; font-size:16px; font-weight:600;"
                            oninput="setPersonAllocation('${name}', 'krw', this.value)">
                        </div>
                        <div class="currency-input" style="background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px;">
                            <span class="currency-symbol">NT$</span>
                            <input type="number" value="${a.twd || 0}" min="0"
                            style="border:none; background:transparent; width:100%; font-size:16px; font-weight:600;"
                            oninput="setPersonAllocation('${name}', 'twd', this.value)">
                        </div>
                        </div>
                    </div>
                    `;
                }).join('');
            }

            function setPersonAllocation(name, currency, value) {
                ensureAllocation(name);
                const v = Math.max(0, Number(value) || 0);
                splitAllocations[name][currency] = v;
                updateSplitPreview();
            }


        function saveExpense() {
            const { mainMode, splitMethod } = getSplitModeFromSelect();
        
        const expense = {
            id: editingExpenseId || Date.now(),
            uniqueKey: editingExpenseId ? expenses.find(e => e.id === editingExpenseId)?.uniqueKey : `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
            datetime: document.getElementById('datetime').value,
            itemName: document.getElementById('itemName').value.trim(),
            category: document.querySelector('input[name="category"]:checked').value,
            krw: parseFloat(document.getElementById('krw').value) || 0,
            twd: parseFloat(document.getElementById('twd').value) || 0,
            payment: document.querySelector('input[name="payment"]:checked').value,
            split: document.getElementById('enableSplit').checked,
            splitMode: mainMode,  // 'split' 或 'proxy'
            splitMethod: splitMethod,  // 'equal' 或 'custom'
            splitPeople: [...splitPeople],
            splitAllocations: JSON.parse(JSON.stringify(splitAllocations)), // 深拷貝避免被後續改到
            note: document.getElementById('note').value.trim(),
            settled: false
        };

            if (!expense.itemName) {
                showToast('請填寫項目名稱!');
                return;
            }

            if (expense.krw === 0 && expense.twd === 0) {
                showToast('請至少填寫一種金額!');
                return;
            }

            if (editingExpenseId) {
                const index = expenses.findIndex(e => e.id === editingExpenseId);
                if (index !== -1) {
                    expenses[index] = expense;
                    showToast('記帳已更新!');
                }
                editingExpenseId = null;
            } else {
                expenses.push(expense);
                showToast('記帳成功!');
            }
            
            expenses.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
            
            saveToStorage();
            resetForm();
            renderExpenses();
        }

        function renderExpenses() {
            const container = document.getElementById('expenseList');
            
            let displayList = expenses;
            if (currentExpenseFilter) {
                displayList = filterExpenses(currentExpenseFilter);
            }
            
            // ===== 總支出永遠用全部 expenses 計算,不受篩選影響 =====
            let totalKRW = 0;
            let totalTWD = 0;
            
            expenses.forEach(e => {  // 注意這裡用 expenses,不是 displayList
                const totalK = Number(e.krw) || 0;
                const totalT = Number(e.twd) || 0;

                if (!e.split || !e.splitPeople || e.splitPeople.length === 0) {
                    totalKRW += totalK;
                    totalTWD += totalT;
                    return;
                }

                const mode = e.splitMode || 'split';
                const method = e.splitMethod || 'equal';

                if (mode === 'split' && method === 'equal') {
                    const denom = (e.splitPeople.length + 1);
                    totalKRW += denom > 0 ? totalK / denom : 0;
                    totalTWD += denom > 0 ? totalT / denom : 0;
                    return;
                }

                // proxy 或 split+custom：用 splitAllocations 加總
                const alloc = e.splitAllocations || {};
                let otherKRW = 0;
                let otherTWD = 0;

                e.splitPeople.forEach(p => {
                    const a = alloc[p] || { krw: 0, twd: 0 };
                    otherKRW += Number(a.krw) || 0;
                    otherTWD += Number(a.twd) || 0;
                });

                totalKRW += (totalK - otherKRW);
                totalTWD += (totalT - otherTWD);
            });

            // 更新總支出顯示
            document.getElementById('totalKRW').textContent = '₩' + Math.round(totalKRW).toLocaleString();
            document.getElementById('totalTWD').textContent = 'NT$' + Math.round(totalTWD).toLocaleString();

                return `

                                </div>

                            <label class="form-label">備註 (選填)</label>

                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            
            // 設定分帳資料
            window.editSplitPeople = expense.split ? [...expense.splitPeople] : [];
            window.editSplitAllocations = expense.split && expense.splitAllocations ? JSON.parse(JSON.stringify(expense.splitAllocations)) : {};
            
            renderEditSplitPeople();
            renderEditSplitAllocations();
            updateEditSplitPreview();
            
            // 顯示彈窗
            setTimeout(() => overlay.classList.add('show'), 10);
            
            // 關閉下拉選單
            document.querySelectorAll('.expense-dropdown').forEach(m => m.classList.remove('show'));
