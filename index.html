        function closeEditModal() {
            const modal = document.getElementById('editExpenseModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 300);
            }
            window.editSplitPeople = [];
            window.editSplitAllocations = {};
        }

        function toggleEditSplit() {
            const checkbox = document.getElementById('edit-enableSplit');
            checkbox.checked = !checkbox.checked;
            document.getElementById('edit-splitContent').style.display = checkbox.checked ? 'block' : 'none';
            
            if (checkbox.checked && (!window.editSplitPeople || window.editSplitPeople.length === 0)) {
                const otherPerson = currentUser === 'Chi' ? 'Jhen' : 'Chi';
                window.editSplitPeople = [otherPerson];
                ensureEditAllocation(otherPerson);
                renderEditSplitPeople();
                renderEditSplitAllocations();
                updateEditSplitPreview();
            }
        }

        function handleEditSplitModeChange() {
            renderEditSplitAllocations();
            updateEditSplitPreview();
        }

        function addEditPerson() {
            const input = document.getElementById('edit-personName');
            const name = input.value.trim();
            
            if (name && !window.editSplitPeople.includes(name)) {
                window.editSplitPeople.push(name);
                ensureEditAllocation(name);
                renderEditSplitAllocations();
                updateEditSplitPreview();
                renderEditSplitPeople();
                input.value = '';
            }
        }

        function removeEditPerson(name) {
            window.editSplitPeople = window.editSplitPeople.filter(p => p !== name);
            delete window.editSplitAllocations[name];
            renderEditSplitAllocations();
            updateEditSplitPreview();
            renderEditSplitPeople();
        }

        function renderEditSplitPeople() {
            const container = document.getElementById('edit-splitPeople');
            if (!container) return;
            
            container.innerHTML = (window.editSplitPeople || []).map(name => `
                <div class="person-tag">
                    ${name}
                    <button onclick="removeEditPerson('${name}')">×</button>
                </div>
            `).join('');
        }

        function ensureEditAllocation(name) {
            if (!window.editSplitAllocations) window.editSplitAllocations = {};
            if (!window.editSplitAllocations[name]) {
                window.editSplitAllocations[name] = { krw: 0, twd: 0 };
            }
        }

        function renderEditSplitAllocations() {
            const wrap = document.getElementById('edit-splitAllocationsWrap');
            const container = document.getElementById('edit-splitAllocations');
            if (!wrap || !container) return;

            const enabled = document.getElementById('edit-enableSplit').checked;
            if (!enabled || !window.editSplitPeople || window.editSplitPeople.length === 0) {
                wrap.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            const selectValue = document.getElementById('edit-splitModeSelect').value;
            const shouldShow = (selectValue === 'proxy') || (selectValue === 'split-custom');
            wrap.style.display = shouldShow ? 'block' : 'none';

            if (!shouldShow) {
                container.innerHTML = '';
                return;
            }

            window.editSplitPeople.forEach(ensureEditAllocation);

            container.innerHTML = window.editSplitPeople.map(name => {
                const a = window.editSplitAllocations[name] || { krw: 0, twd: 0 };
                return `
                    <div class="currency-item" style="margin-bottom: 10px;">
                        <div class="currency-label">👤 ${name} 應付</div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="currency-input" style="background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px;">
                                <span class="currency-symbol">₩</span>
                                <input type="number" value="${a.krw || 0}" min="0"
                                style="border:none; background:transparent; width:100%; font-size:16px; font-weight:600;"
                                oninput="setEditPersonAllocation('${name}', 'krw', this.value)">
                            </div>
                            <div class="currency-input" style="background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px;">
                                <span class="currency-symbol">NT$</span>
                                <input type="number" value="${a.twd || 0}" min="0"
                                style="border:none; background:transparent; width:100%; font-size:16px; font-weight:600;"
                                oninput="setEditPersonAllocation('${name}', 'twd', this.value)">
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setEditPersonAllocation(name, currency, value) {
            ensureEditAllocation(name);
            const v = Math.max(0, Number(value) || 0);
            window.editSplitAllocations[name][currency] = v;
            updateEditSplitPreview();
        }

        function updateEditSplitPreview() {
            const preview = document.getElementById('edit-splitPreview');
            if (!preview) return;

            const enabled = document.getElementById('edit-enableSplit').checked;
            if (!enabled) {
                preview.innerHTML = '';
                return;
            }

            if (!window.editSplitPeople || window.editSplitPeople.length === 0) {
                preview.innerHTML = '👥 請先新增分帳/代購對象';
                return;
            }

            const selectValue = document.getElementById('edit-splitModeSelect').value;
            const totalKRW = Number(document.getElementById('edit-krw').value) || 0;
            const totalTWD = Number(document.getElementById('edit-twd').value) || 0;

            let myKRW = 0;
            let myTWD = 0;
            let otherKRW = 0;
            let otherTWD = 0;

            if (selectValue === 'split-equal') {
                const denom = window.editSplitPeople.length + 1;
                myKRW = denom > 0 ? totalKRW / denom : 0;
                myTWD = denom > 0 ? totalTWD / denom : 0;
                otherKRW = totalKRW - myKRW;
                otherTWD = totalTWD - myTWD;
            } else {
                window.editSplitPeople.forEach(p => {
                    const a = window.editSplitAllocations[p] || { krw: 0, twd: 0 };
                    otherKRW += Number(a.krw) || 0;
                    otherTWD += Number(a.twd) || 0;
                });
                myKRW = totalKRW - otherKRW;
                myTWD = totalTWD - otherTWD;
            }

            const overKRW = myKRW < 0;
            const overTWD = myTWD < 0;

            const title = (selectValue === 'proxy') ? '🎁 代購' : 
                        (selectValue === 'split-equal' ? '👥 分帳・平分' : '👥 分帳・自訂');

            preview.innerHTML = `
                ✅ ${title}<br>
                總額：₩${Math.round(totalKRW).toLocaleString()} / NT$${Math.round(totalTWD).toLocaleString()}<br>
                對方合計：₩${Math.round(otherKRW).toLocaleString()} / NT$${Math.round(otherTWD).toLocaleString()}<br>
                <b style="color:${(overKRW || overTWD) ? '#E74C3C' : 'var(--text-dark)'}">
                    你負擔：₩${Math.round(myKRW).toLocaleString()} / NT$${Math.round(myTWD).toLocaleString()}
                </b>
                ${(overKRW || overTWD) ? `<div style="margin-top:6px; color:#E74C3C;">⚠️ 對方合計不能超過總額</div>` : ''}
            `;
        }

        function saveEditedExpense(index) {
            const selectValue = document.getElementById('edit-splitModeSelect').value;
            let splitMode = 'split';
            let splitMethod = 'equal';
            
            if (selectValue === 'proxy') {
                splitMode = 'proxy';
                splitMethod = 'custom';
            } else if (selectValue === 'split-custom') {
                splitMode = 'split';
                splitMethod = 'custom';
            }
            
            const updatedExpense = {
                ...expenses[index],
                datetime: document.getElementById('edit-datetime').value,
                itemName: document.getElementById('edit-itemName').value.trim(),
                category: document.querySelector('input[name="edit-category"]:checked').value,
                krw: parseFloat(document.getElementById('edit-krw').value) || 0,
                twd: parseFloat(document.getElementById('edit-twd').value) || 0,
                payment: document.querySelector('input[name="edit-payment"]:checked').value,
                split: document.getElementById('edit-enableSplit').checked,
                splitMode: splitMode,
                splitMethod: splitMethod,
                splitPeople: window.editSplitPeople ? [...window.editSplitPeople] : [],
                splitAllocations: window.editSplitAllocations ? JSON.parse(JSON.stringify(window.editSplitAllocations)) : {},
                note: document.getElementById('edit-note').value.trim()
            };

            if (!updatedExpense.itemName) {
                showToast('請填寫項目名稱!');
                return;
            }

            if (updatedExpense.krw === 0 && updatedExpense.twd === 0) {
                showToast('請至少填寫一種金額!');
                return;
            }

            expenses[index] = updatedExpense;
            saveToStorage();
            renderExpenses();
            closeEditModal();
            showToast('✅ 記帳已更新!');
        }

        function deleteExpense(index) {
            if (confirm('確定要刪除這筆記帳嗎?')) {
                expenses.splice(index, 1);
                saveToStorage();
                renderExpenses();
                showToast('記帳已刪除');
            }
            document.querySelectorAll('.expense-dropdown').forEach(m => m.classList.remove('show'));
        }

        // ========== 篩選功能 ==========
        
        function switchFilter(type) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

                content.innerHTML = '';

            }

                content.innerHTML = `
                    <div class="filter-options" style="display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap;">
                        <button class="filter-option-btn" onclick="filterByCategory('食')">🍽️ 食</button>
                        <button class="filter-option-btn" onclick="filterByCategory('衣')">👕 衣</button>
                        <button class="filter-option-btn" onclick="filterByCategory('住')">🏨 住</button>
                        <button class="filter-option-btn" onclick="filterByCategory('行')">🚇 行</button>
                        <button class="filter-option-btn" onclick="filterByCategory('樂')">🎪 樂</button>
                        <button class="filter-option-btn" onclick="filterByCategory('儲值')">💰 儲值</button>
                        <button class="filter-option-btn" onclick="filterByCategory('其他')">📦 其他</button>
                    </div>
                `;
            } else if (type === 'date') {
                const dates = [...new Set(expenses.map(e => {
                    const d = new Date(e.datetime);

                }))].sort().reverse();
                
                content.innerHTML = `
                    <select id="dateSelect" onchange="filterByDate()" style="width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);">
                        <option value="">選擇日期</option>
                        ${dates.map(date => `<option value="${date}">${date}</option>`).join('')}
                    </select>
                `;

                content.innerHTML = `
                    <div class="filter-options">
                        <button class="filter-option-btn" onclick="filterByPayment('現金')">現金</button>
                        <button class="filter-option-btn" onclick="filterByPayment('信用卡')">信用卡</button>
                        <button class="filter-option-btn" onclick="filterByPayment('電子支付')">電子支付</button>
                        <button class="filter-option-btn" onclick="filterByPayment('TM/WP')">TM/WP</button>
                    </div>
                `;
            } else if (type === 'keyword') {
                content.innerHTML = `
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="searchKeyword" placeholder="搜尋項目名稱或備註..." style="flex: 1; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;" onkeypress="if(event.key==='Enter') searchExpenses()">
                        <button onclick="searchExpenses()" style="padding: 12px 20px; background: linear-gradient(135deg,var(--coral),var(--coral-dark)); color: #FFFFFF; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">搜尋</button>
                    </div>
                `;
            }
        }

        function filterByCategory(category) {
            currentExpenseFilter = { type: 'category', value: category };
            document.getElementById('clearExpenseBtn').style.display = 'block';
            renderExpenses();
        }

        function filterByDate() {
            const date = document.getElementById('dateSelect').value;
            if (!date) {
                clearExpenseFilter();
                return;
            }
            currentExpenseFilter = { type: 'date', value: date };
            document.getElementById('clearExpenseBtn').style.display = 'block';
            renderExpenses();
        }

        function filterByPayment(payment) {
            currentExpenseFilter = { type: 'payment', value: payment };
            document.getElementById('clearExpenseBtn').style.display = 'block';
            renderExpenses();
        }

        function filterExpenses(filter) {
            if (!filter) return expenses;
            
            if (filter.type === 'category') {
                return expenses.filter(e => e.category === filter.value);
            } else if (filter.type === 'date') {
                return expenses.filter(e => {
                    const d = new Date(e.datetime);
                    const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    return dateStr === filter.value;
                });
            } else if (filter.type === 'payment') {
                return expenses.filter(e => e.payment === filter.value);
            } else if (filter.type === 'keyword') {
                return expenses.filter(e => {
                    const keyword = filter.value.toLowerCase();
                    const itemName = (e.itemName || '').toLowerCase();
                    const note = (e.note || '').toLowerCase();
                    return itemName.includes(keyword) || note.includes(keyword);
                });
            }
            return expenses;
        }

        function clearExpenseFilter() {
            currentExpenseFilter = null;
            document.getElementById('clearExpenseBtn').style.display = 'none';
            document.getElementById('filterContent').innerHTML = '';
            renderExpenses();
        }

        // ========== 分類統計 ==========
        
        function renderCategoryStats() {
            const container = document.getElementById('categoryStats');
            if (!container) return;

            const categoryTotals = {
                '食': { krw: 0, twd: 0, count: 0, icon: '🍽️', color: '#FF6B6B' },
                '衣': { krw: 0, twd: 0, count: 0, icon: '👕', color: '#4ECDC4' },
                '住': { krw: 0, twd: 0, count: 0, icon: '🏨', color: '#45B7D1' },
                '行': { krw: 0, twd: 0, count: 0, icon: '🚇', color: '#FFA07A' },
                '樂': { krw: 0, twd: 0, count: 0, icon: '🎪', color: '#98D8C8' },
                '儲值': { krw: 0, twd: 0, count: 0, icon: '💰', color: '#F39C12' },
                '其他': { krw: 0, twd: 0, count: 0, icon: '📦', color: '#95A5A6' }
            };

            expenses.forEach(e => {
                const category = e.category;
                if (!categoryTotals[category]) return;

                categoryTotals[category].count++;
                const totalK = Number(e.krw) || 0;
                const totalT = Number(e.twd) || 0;

                if (!e.split || !e.splitPeople || e.splitPeople.length === 0) {
                    categoryTotals[category].krw += totalK;
                    categoryTotals[category].twd += totalT;
                    return;
                }

                const mode = e.splitMode || 'split';
                const method = e.splitMethod || 'equal';

                if (mode === 'split' && method === 'equal') {
                    const denom = e.splitPeople.length + 1;
                    categoryTotals[category].krw += denom > 0 ? totalK / denom : 0;
                    categoryTotals[category].twd += denom > 0 ? totalT / denom : 0;
                    return;
                }

                const alloc = e.splitAllocations || {};
                let otherKRW = 0;
                let otherTWD = 0;

                e.splitPeople.forEach(p => {
                    const a = alloc[p] || { krw: 0, twd: 0 };
                    otherKRW += Number(a.krw) || 0;
                    otherTWD += Number(a.twd) || 0;
                });

                categoryTotals[category].krw += (totalK - otherKRW);
                categoryTotals[category].twd += (totalT - otherTWD);
            });

            // ✅ 改成固定順序
            const fixedOrder = ['食', '衣', '住', '行', '樂', '儲值', '其他'];
            const sortedCategories = fixedOrder
                .map(cat => [cat, categoryTotals[cat]])
                .filter(([_, data]) => data && data.count > 0);

            if (sortedCategories.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-gray); padding: 20px; grid-column: 1 / -1;">暫無分類統計</div>';
                return;
            }

            container.innerHTML = sortedCategories.map(([category, data]) => `
                <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 8px; background: var(--surface-2); border-radius: 12px; border-top: 3px solid ${data.color}; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 4px 16px rgba(44,36,32,0.12)';" onmouseout="this.style.transform=''; this.style.boxShadow='';">
                    <div style="font-size: 28px; margin-bottom: 6px;">${data.icon}</div>
                    <div style="font-weight: 600; color: var(--text-dark); margin-bottom: 6px; font-size: 14px;">${category}</div>
                    <div style="display: flex; flex-direction: column; gap: 2px; align-items: center;">
                        <div style="font-size: 14px; font-weight: 700; color: ${data.color};">₩${Math.round(data.krw).toLocaleString()}</div>
                        <div style="font-size: 14px; font-weight: 700; color: ${data.color};">NT$${Math.round(data.twd).toLocaleString()}</div>
                    </div>
                    <div style="font-size: 11px; color: var(--text-gray); margin-top: 4px;">${data.count} 筆</div>
                </div>
            `).join('');
        }

            const reader = new FileReader();

                currentImageData = e.target.result;

        function addShoppingItem() {
            const item = document.getElementById('shoppingItem').value.trim();
            
            if (!item) {
                showToast('請輸入商品名稱');
                return;
            }

            const shopping = {
                id: editingShoppingId || Date.now(),
                image: currentImageData,
                item: item,
                location: document.getElementById('shoppingLocation').value.trim(),
                targetQty: parseInt(document.getElementById('shoppingTargetQty').value) || 1,
                purchasedQty: 0,
                krw: parseFloat(document.getElementById('shoppingKRW').value) || 0,
                twd: parseFloat(document.getElementById('shoppingTWD').value) || 0,
                note: document.getElementById('shoppingNote').value.trim(),
                purchased: false
            };

            if (editingShoppingId) {
                const index = shoppingList.findIndex(s => s.id === editingShoppingId);
                if (index !== -1) {
                    shoppingList[index] = {
                        ...shopping,
                        purchasedQty: shoppingList[index].purchasedQty
                    };
                    showToast('商品已更新!');
                }
                editingShoppingId = null;
            } else {
                shoppingList.push(shopping);
                showToast('已加入購物清單');

            saveShopping();
            renderShopping();
            updateLocationFilters();
            resetShoppingForm();

            document.getElementById('shoppingItem').value = '';

            document.getElementById('shoppingTargetQty').value = '1';
            document.getElementById('shoppingKRW').value = '';
            document.getElementById('shoppingTWD').value = '';

        function editShopping(index) {
            const shopping = shoppingList[index];
            editingShoppingId = shopping.id;
            
            document.getElementById('shoppingItem').value = shopping.item;
            document.getElementById('shoppingLocation').value = shopping.location || '';
            document.getElementById('shoppingTargetQty').value = shopping.targetQty || 1;
            document.getElementById('shoppingKRW').value = shopping.krw || '';
            document.getElementById('shoppingTWD').value = shopping.twd || '';
            document.getElementById('shoppingNote').value = shopping.note || '';
            document.getElementById('shoppingFormModeTitle').textContent = '編輯商品';
            
            if (shopping.image) {
                document.getElementById('imagePreview').innerHTML = `<img src="${shopping.image}" alt="preview">`;
                currentImageData = shopping.image;

            const statsCard = document.getElementById('shoppingStatsCard');
            const statsGrid = document.getElementById('shoppingStats');
            
            let displayList = shoppingList;
            if (currentShoppingFilter) {
                displayList = shoppingList.filter(s => s.location === currentShoppingFilter);
            }
            
            const total = displayList.length;
            const purchased = displayList.filter(s => {
                const targetQty = s.targetQty || 0;
                const purchasedQty = s.purchasedQty || 0;
                return s.purchased || (targetQty > 0 && purchasedQty >= targetQty);
            }).length;
            
            const totalKRW = displayList.reduce((sum, s) => {
                const qty = s.targetQty || 1;
                return sum + (s.krw * qty);
            }, 0);
            const totalTWD = displayList.reduce((sum, s) => {
                const qty = s.targetQty || 1;
                return sum + (s.twd * qty);
            }, 0);
            
            if (shoppingList.length > 0) {
                statsCard.style.display = 'block';

                    <div class="stat-item">
                        <div class="stat-label">${currentShoppingFilter ? '篩選結果' : '總數'}</div>
                        <div class="stat-value">${total} 項</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">已完成</div>
                        <div class="stat-value">${purchased} 項</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">預估韓元</div>
                        <div class="stat-value">₩${Math.round(totalKRW).toLocaleString()}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">預估台幣</div>
                        <div class="stat-value">NT$${Math.round(totalTWD).toLocaleString()}</div>

                statsCard.style.display = 'none';

                    <div class="empty-state">
                        <div class="empty-icon">🛍️</div>
                        <div class="empty-text">${currentShoppingFilter ? '此地點沒有商品' : '購物清單是空的'}</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = displayList.map((shopping) => {
                const actualIndex = shoppingList.indexOf(shopping);
                const targetQty = shopping.targetQty || 0;
                const purchasedQty = shopping.purchasedQty || 0;
                const isComplete = targetQty > 0 && purchasedQty >= targetQty;
                const purchasedClass = shopping.purchased || isComplete ? 'purchased' : '';
                const progress = targetQty > 0 ? Math.min((purchasedQty / targetQty * 100), 100) : 0;
                
                return `
                    <div class="shopping-card ${purchasedClass}">

                            <div class="shopping-header">
                                <div class="shopping-title ${purchasedClass}">
                                    ${shopping.item}
                                </div>
                            </div>
                            
                            ${shopping.location ? `<div class="shopping-info">📍 ${shopping.location}</div>` : ''}
                            
                            ${targetQty > 0 ? `
                                <div class="shopping-quantity">
                                    <div class="qty-info">
                                        <span>進度: ${purchasedQty} / ${targetQty}</span>
                                        <span class="qty-badge ${isComplete ? 'complete' : ''}">${isComplete ? '✓ 已買齊' : '進行中'}</span>
                                    </div>
                                    <div class="qty-progress">
                                        <div class="qty-progress-bar" style="width: ${progress}%"></div>
                                    </div>
                                    
                                    <div style="margin-top: 12px;">
                                        <div style="font-size: 12px; color: var(--text-gray); margin-bottom: 4px;">已購買數量</div>
                                        <div class="qty-actions">
                                            <button class="qty-btn" onclick="updatePurchasedQty(${actualIndex}, -1)">－</button>
                                            <span>${purchasedQty}</span>
                                            <button class="qty-btn" onclick="updatePurchasedQty(${actualIndex}, 1)">＋</button>
                                        </div>
                                    </div>
                                    
                                    <div style="margin-top: 8px;">
                                        <div style="font-size: 12px; color: var(--text-gray); margin-bottom: 4px;">目標數量</div>
                                        <div class="qty-actions">
                                            <button class="qty-btn" onclick="updateTargetQty(${actualIndex}, -1)">－</button>
                                            <span>${targetQty}</span>
                                            <button class="qty-btn" onclick="updateTargetQty(${actualIndex}, 1)">＋</button>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            ${(shopping.krw > 0 || shopping.twd > 0) ? `
                                <div class="shopping-prices">

                                    ${shopping.twd > 0 ? `<span>單價 NT$${shopping.twd.toLocaleString()}${targetQty > 1 ? ` × ${targetQty} = NT$${(shopping.twd * targetQty).toLocaleString()}` : ''}</span>` : ''}

        function updatePurchasedQty(index, change) {
            const item = shoppingList[index];
            const newQty = (item.purchasedQty || 0) + change;
            
            if (newQty < 0) return;
            
            shoppingList[index].purchasedQty = newQty;
            
            if (item.targetQty && newQty >= item.targetQty) {
                shoppingList[index].purchased = true;
            } else if (newQty < item.targetQty) {
                shoppingList[index].purchased = false;
            }
            
            saveShopping();
            renderShopping();
        }

        function updateTargetQty(index, change) {
            const item = shoppingList[index];
            const newQty = (item.targetQty || 0) + change;
            
            if (newQty < 1) return;
            
            shoppingList[index].targetQty = newQty;
            saveShopping();
            renderShopping();
        }

        function togglePurchase(index) {
            shoppingList[index].purchased = !shoppingList[index].purchased;
            saveShopping();
            renderShopping();
        }

        function deleteShopping(index) {
            if (confirm('確定要刪除這個商品嗎?')) {
                shoppingList.splice(index, 1);
                saveShopping();
                renderShopping();
                updateLocationFilters();
                showToast('已從購物清單移除');
            }
        }

        function updateLocationFilters() {
            const filterCard = document.getElementById('locationFilterCard');
            const container = document.getElementById('locationFilters');
            
            const locations = [...new Set(shoppingList.map(s => s.location).filter(l => l))];
            
            if (locations.length === 0) {
                filterCard.style.display = 'none';
                return;
            }
            
            filterCard.style.display = 'block';
            
            container.innerHTML = locations.map(location => {
                const count = shoppingList.filter(s => s.location === location).length;
                const activeClass = currentShoppingFilter === location ? 'active' : '';
                return `
                    <button class="location-btn ${activeClass}" onclick="filterByLocation('${location}')">
                        📍 ${location} (${count})
                    </button>
                `;
            }).join('');
        }

        function filterByLocation(location) {
            if (currentShoppingFilter === location) {
                clearShoppingFilter();
                return;
            }
            
            currentShoppingFilter = location;
            document.getElementById('clearShoppingBtn').style.display = 'block';
            updateLocationFilters();
            renderShopping();
        }

        function clearShoppingFilter() {
            currentShoppingFilter = null;
            document.getElementById('clearShoppingBtn').style.display = 'none';
            updateLocationFilters();
            renderShopping();
        }

        // ========== 分帳統計 ==========
        
        function renderSplitReport() {
    const container = document.getElementById('splitReportContent');
    const splitExpenses = expenses.filter(e => e.split && e.splitPeople.length > 0);
    
    if (splitExpenses.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📊</div>
                <div class="empty-text">目前沒有分帳記錄</div>
            </div>
        `;
        return;
    }
    
    const peopleStats = {};
    
    splitExpenses.forEach(expense => {
        const mode = expense.splitMode || 'split';
        const method = expense.splitMethod || 'equal';
        
        if (mode === 'proxy') {
            // ✅ 代購模式：全額算對方的
            expense.splitPeople.forEach(person => {
                if (!peopleStats[person]) {
                    peopleStats[person] = {
                        name: person,
                        totalKRW: 0,
                        totalTWD: 0,
                        count: 0,
                        expenses: []
                    };
                }
                
                peopleStats[person].totalKRW += expense.krw;
                peopleStats[person].totalTWD += expense.twd;
                peopleStats[person].count += 1;
                peopleStats[person].expenses.push({
                    item: expense.itemName,
                    krw: expense.krw,
                    twd: expense.twd,
                    datetime: expense.datetime,
                    type: '代購',
                    category: expense.category,
                    payment: expense.payment,
                    note: expense.note
                });
            });
        } else if (method === 'equal') {
            // ✅ 分帳 + 平分
            const totalPeople = expense.splitPeople.length + 1;
            const perPersonKRW = expense.krw / totalPeople;
            const perPersonTWD = expense.twd / totalPeople;
            
            expense.splitPeople.forEach(person => {
                if (!peopleStats[person]) {
                    peopleStats[person] = {
                        name: person,
                        totalKRW: 0,
                        totalTWD: 0,
                        count: 0,
                        expenses: []
                    };
                }
                
                peopleStats[person].totalKRW += perPersonKRW;
                peopleStats[person].totalTWD += perPersonTWD;
                peopleStats[person].count += 1;
                peopleStats[person].expenses.push({
                    item: expense.itemName,
                    krw: Math.round(perPersonKRW),
                    twd: Math.round(perPersonTWD),
                    datetime: expense.datetime,
                    type: '平分',
                    category: expense.category,
                    payment: expense.payment,
                    note: expense.note,
                    totalPeople: totalPeople
                });
            });
        } else {
            // ✅ 分帳 + 自訂金額（這是新加的！）
            const alloc = expense.splitAllocations || {};
            
            expense.splitPeople.forEach(person => {
                if (!peopleStats[person]) {
                    peopleStats[person] = {
                        name: person,
                        totalKRW: 0,
                        totalTWD: 0,
                        count: 0,
                        expenses: []
                    };
                }
                
                const personAlloc = alloc[person] || { krw: 0, twd: 0 };
                const personKRW = Number(personAlloc.krw) || 0;
                const personTWD = Number(personAlloc.twd) || 0;
                
                peopleStats[person].totalKRW += personKRW;
                peopleStats[person].totalTWD += personTWD;
                peopleStats[person].count += 1;
                peopleStats[person].expenses.push({
                    item: expense.itemName,
                    krw: personKRW,
                    twd: personTWD,
                    datetime: expense.datetime,
                    type: '自訂',
                    category: expense.category,
                    payment: expense.payment,
                    note: expense.note
                });
            });
        }
    });
    
    const sortedPeople = Object.values(peopleStats).sort((a, b) => b.totalTWD - a.totalTWD);
    
    container.innerHTML = sortedPeople.map(person => {
        // 計算韓元換算成的台幣
        const krwToTWD = Math.round(person.totalKRW * exchangeRate);
        // 應付總額 = 韓元換算台幣 + 原本的台幣
        const totalPayable = krwToTWD + Math.round(person.totalTWD);
        
        return `
            <div class="split-card">
                <div class="split-person-name">👤 ${person.name}</div>
                <div class="split-stats">
                    <div class="split-stat-row">
                        <span class="split-stat-label">參與次數</span>
                        <span class="split-stat-value">${person.count} 次</span>
                    </div>
                    <div class="split-stat-row">
                        <span class="split-stat-label">應付韓元</span>
                        <span class="split-stat-value">₩${Math.round(person.totalKRW).toLocaleString()} (NT$${krwToTWD.toLocaleString()})</span>
                    </div>
                    <div class="split-stat-row">
                        <span class="split-stat-label">應付台幣</span>
                        <span class="split-stat-value">NT$${Math.round(person.totalTWD).toLocaleString()}</span>
                    </div>
                    <div class="split-stat-row" style="border-top: 1px dashed var(--border-light); padding-top: 8px; margin-top: 8px;">
                        <span class="split-stat-label" style="font-weight: 700; color: var(--text-dark);">應付總額</span>
                        <span class="split-stat-value" style="font-size: 18px; font-weight: 700; color: var(--teal);">NT$${totalPayable.toLocaleString()}</span>
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="downloadSplitStatement('${person.name}')" style="margin-top: 16px;">
                    📥 下載 ${person.name} 的對帳單
                </button>
                
                <div class="split-details">
                    <div class="split-detail-title">明細:</div>
                    ${person.expenses.map(exp => {
                        const date = new Date(exp.datetime);
                        const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
                        return `<div class="split-item">• ${dateStr} ${exp.item} [${exp.type}]: ₩${exp.krw.toLocaleString()} / NT$${exp.twd.toLocaleString()}</div>`;
                    }).join('')}
                </div>
            </div>
        `;
    }).join('');
}

        // ========== 匯入 CSV ==========
        
        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    
                    // 跳過標題行和說明行
                    let addCount = 0;
                    let updateCount = 0;
                    let errorCount = 0;
                    const errors = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line || line.startsWith('//')) continue; // 跳過空行和說明
                        
                        try {
                            const expense = parseCSVLine(line, i + 1);
                            if (expense) {
                                // 自動判斷: 有 uniqueKey 就更新,沒有就新增
                                if (expense.uniqueKey) {
                                    const existingIndex = expenses.findIndex(e => e.uniqueKey === expense.uniqueKey);
                                    if (existingIndex !== -1) {
                                        // 找到相同 uniqueKey,覆蓋更新(保留原 ID)
                                        expense.id = expenses[existingIndex].id;
                                        expenses[existingIndex] = expense;
                                        updateCount++;
                                    } else {
                                        // uniqueKey 不存在,當新增
                                        expense.id = Date.now() + Math.random();
                                        expenses.push(expense);
                                        addCount++;
                                    }
                                } else {
                                    // 沒有 ID,直接新增
                                    expenses.push(expense);
                                    addCount++;
                                }
                            }
                        } catch (error) {
                            errorCount++;
                            errors.push(`第 ${i + 1} 行: ${error.message}`);
                        }
                    }
                    
                    if (addCount > 0 || updateCount > 0) {
                        expenses.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
                        saveToStorage();
                        renderExpenses();
                    }
                    
                    // 顯示結果
                    let message = '';
                    if (updateCount > 0) {
                        message = `✅ 新增 ${addCount} 筆, 更新 ${updateCount} 筆`;
                    } else {
                        message = `✅ 成功匯入 ${addCount} 筆記帳`;
                    }
                    
                    if (errorCount > 0) {
                        message += `\n❌ 失敗 ${errorCount} 筆`;
                        console.log('匯入錯誤:', errors);
                    }
                    
                    showToast(message);
                    
                    if (errors.length > 0 && errors.length <= 5) {
                        setTimeout(() => {
                            alert('匯入錯誤明細:\n' + errors.join('\n'));
                        }, 1000);
                    }
                    
                } catch (error) {
                    console.error('匯入失敗:', error);
                    showToast('❌ 匯入失敗: ' + error.message);
                }
            };
            
            reader.readAsText(file, 'UTF-8');
            event.target.value = ''; // 清空以便下次選擇同一檔案
        }

        function parseCSVLine(line, lineNumber) {
            // 處理CSV的引號
            const values = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            
            if (values.length < 13) {
                throw new Error(`欄位數量不足 (需要13欄,只有${values.length}欄)`);
            }
            
            const [uniqueKeyStr, dateStr, timeStr, itemName, category, krw, twd, payment, 
                   splitModeStr, splitMethodStr, splitPeopleStr, customAllocStr, note] = values;
            
            // 驗證必填欄位
            if (!itemName) throw new Error('項目名稱不能為空');
            if (!category) throw new Error('分類不能為空');
            
            // 驗證分類
            const validCategories = ['食', '衣', '住', '行', '樂', '儲值', '其他'];
            if (!validCategories.includes(category)) {
                throw new Error(`分類必須是: ${validCategories.join(', ')}`);
            }
            
            // 驗證付款方式
            const validPayments = ['現金', '信用卡', '電子支付', 'TM/WP'];
            if (!validPayments.includes(payment)) {
                throw new Error(`付款方式必須是: ${validPayments.join(', ')}`);
            }
            
            // 解析日期時間
            let datetime;
            try {
                const [year, month, day] = dateStr.split('/');
                const [hour, minute] = timeStr.split(':');
                datetime = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}T${hour.padStart(2, '0')}:${minute.padStart(2, '0')}`;
            } catch (e) {
                throw new Error('日期時間格式錯誤 (應為: YYYY/MM/DD HH:MM)');
            }
            
            // 解析分帳
            const hasSplit = splitModeStr === '分帳' || splitModeStr === '代購';
            let splitMode = 'split';
            let splitMethod = 'equal';
            let splitPeople = [];
            let splitAllocations = {};
            
            if (hasSplit) {
                splitMode = splitModeStr === '代購' ? 'proxy' : 'split';
                
                // 解析分帳對象
                if (splitPeopleStr) {
                    splitPeople = splitPeopleStr.split(',').map(p => p.trim()).filter(p => p);
                }
                
                if (splitPeople.length === 0) {
                    throw new Error('分帳/代購必須指定對象');
                }
                
                // 解析分帳方式和自訂金額
                if (splitMode === 'split') {
                    splitMethod = splitMethodStr === '自訂' ? 'custom' : 'equal';
                    
                    if (splitMethod === 'custom' && customAllocStr) {
                        // 解析自訂金額: "Jhen:40000:960,Amy:30000:720"
                        const allocations = customAllocStr.split(',');
                        allocations.forEach(alloc => {
                            const parts = alloc.trim().split(':');
                            if (parts.length === 3) {
                                const [name, allocKRW, allocTWD] = parts;
                                splitAllocations[name.trim()] = {
                                    krw: parseFloat(allocKRW) || 0,
                                    twd: parseFloat(allocTWD) || 0
                                };
                            }
                        });
                    }
                } else {
                    // 代購模式必須有自訂金額
                    if (customAllocStr) {
                        const allocations = customAllocStr.split(',');
                        allocations.forEach(alloc => {
                            const parts = alloc.trim().split(':');
                            if (parts.length === 3) {
                                const [name, allocKRW, allocTWD] = parts;
                                splitAllocations[name.trim()] = {
                                    krw: parseFloat(allocKRW) || 0,
                                    twd: parseFloat(allocTWD) || 0
                                };
                            }
                        });
                    }
                }
            }
            
            return {
                id: Date.now() + Math.random(),
                datetime: datetime,
                itemName: itemName,
                category: category,
                krw: parseFloat(krw) || 0,
                twd: parseFloat(twd) || 0,
                payment: payment,
                split: hasSplit,
                splitMode: splitMode,
                splitMethod: splitMethod,
                splitPeople: splitPeople,
                splitAllocations: splitAllocations,
                note: note || '',
                settled: false
            };
            
            // 如果有 uniqueKey,保留 (用於更新模式)
            if (uniqueKeyStr && uniqueKeyStr.trim()) {
                expense.uniqueKey = uniqueKeyStr.trim();
            }
            
            return expense;
        }

        function calculateTWDInSettings() {
            const krw = Number(document.getElementById('krwAmountCalc').value) || 0;
            const twdToKrw = Number(document.getElementById('exchangeRateInput').value) || 41.67;
            const twd = Math.round(krw / twdToKrw);
            
            const resultDiv = document.getElementById('twdResult');
            if (krw > 0) {
                resultDiv.textContent = `= NT$ ${twd.toLocaleString()}`;
            } else {
                resultDiv.textContent = '';
            }
        }
        
        function saveExchangeRate() {
            const twdToKrw = Number(document.getElementById('exchangeRateInput').value);
            if (!twdToKrw || twdToKrw <= 0) { showToast('❌ 請輸入有效的匯率'); return; }

            exchangeRate = 1 / twdToKrw;

            if (currentProject) {
                currentProject[`exchangeRate_${currentUser}`] = exchangeRate;
                _saveProjectsToStorage();
            }

            document.getElementById('currentRateDisplay').textContent = `匯率: NT$1 = ₩${twdToKrw}`;
            closeExchangeDialog();
            showToast(`✅ 匯率已設定: NT$1 = ₩${twdToKrw}`);

        function migrateToProjects() {
            const hasOldData = localStorage.getItem('koreaExpenses_Chi') !== null ||
                               localStorage.getItem('koreaExpenses_Jhen') !== null;
            const hasProjects = localStorage.getItem('projects') !== null;
            if (!hasOldData || hasProjects) return;

            const normalizeItems = arr => (arr || []).map(item => ({
                ...item,
                targetQty: item.targetQty !== undefined ? item.targetQty : 0,
                purchasedQty: item.purchasedQty !== undefined ? item.purchasedQty : 0
            }));

            const projId = 'proj_' + Date.now();
            const firstProject = {
                id: projId,
                name: '韓國行',
                emoji: '🇰🇷',
                color: '#FF6B6B',
                destination: '韓國',
                startDate: '',
                endDate: '',
                createdAt: new Date().toISOString(),
                exchangeRate_Chi: parseFloat(localStorage.getItem('exchangeRate_Chi')) || 0.024,
                exchangeRate_Jhen: parseFloat(localStorage.getItem('exchangeRate_Jhen')) || 0.024,
                expenses_Chi: JSON.parse(localStorage.getItem('koreaExpenses_Chi') || '[]'),
                expenses_Jhen: JSON.parse(localStorage.getItem('koreaExpenses_Jhen') || '[]'),
                shopping_Chi: normalizeItems(JSON.parse(localStorage.getItem('koreaShopping_Chi') || '[]')),
                shopping_Jhen: normalizeItems(JSON.parse(localStorage.getItem('koreaShopping_Jhen') || '[]')),
            };

            localStorage.setItem('projects', JSON.stringify([firstProject]));
            localStorage.setItem('currentProjectId', projId);
            ['koreaExpenses_Chi','koreaExpenses_Jhen','koreaShopping_Chi','koreaShopping_Jhen',
             'exchangeRate_Chi','exchangeRate_Jhen'].forEach(k => localStorage.removeItem(k));
        }

        function loadProjects() {
            const saved = localStorage.getItem('projects');
            projects = saved ? JSON.parse(saved) : [];

            if (projects.length === 0) {
                currentProject = _createDefaultProject();
                return;
            }

            const savedId = localStorage.getItem('currentProjectId');
            currentProject = (savedId && projects.find(p => p.id === savedId)) || projects[0];
            localStorage.setItem('currentProjectId', currentProject.id);
        }

        function _createDefaultProject() {
            const proj = {
                id: 'proj_' + Date.now(),
                name: '我的旅行',
                emoji: '✈️',
                color: '#4DB8AC',
                destination: '',
                startDate: '',
                endDate: '',
                createdAt: new Date().toISOString(),
                exchangeRate_Chi: 0.024,
                exchangeRate_Jhen: 0.024,
                expenses_Chi: [],
                expenses_Jhen: [],
                shopping_Chi: [],
                shopping_Jhen: [],
            };
            projects.push(proj);
            localStorage.setItem('projects', JSON.stringify(projects));
            localStorage.setItem('currentProjectId', proj.id);
            return proj;
        }

        function _saveProjectsToStorage() {
            if (!currentProject) return;
            const idx = projects.findIndex(p => p.id === currentProject.id);
            if (idx >= 0) projects[idx] = currentProject;
            localStorage.setItem('projects', JSON.stringify(projects));
        }

        function switchProject(projectId) {
            if (currentProject && currentProject.id === projectId) { closeSidebar(); return; }
            saveToStorage();
            saveShopping();
            currentProject = projects.find(p => p.id === projectId);
            if (!currentProject) return;
            localStorage.setItem('currentProjectId', projectId);
            loadExpenses();
            loadShopping();
            loadExchangeRate();
            renderExpenses();
            renderShopping();
            updateLocationFilters();
            renderProjectList();
            renderHeaderProject();
            showToast(`切換到「${currentProject.emoji} ${currentProject.name}」`);
            closeSidebar();
        }

            const proj = {
                id: 'proj_' + Date.now(),
                name: data.name || '新行程',
                emoji: data.emoji || '✈️',
                color: data.color || '#4DB8AC',
                destination: data.destination || '',
                startDate: data.startDate || '',
                endDate: data.endDate || '',
                createdAt: new Date().toISOString(),
                exchangeRate_Chi: currentProject ? currentProject.exchangeRate_Chi : 0.024,
                exchangeRate_Jhen: currentProject ? currentProject.exchangeRate_Jhen : 0.024,
                expenses_Chi: [],
                expenses_Jhen: [],
                shopping_Chi: [],
                shopping_Jhen: [],
            };
            projects.push(proj);
            _saveProjectsToStorage();
            switchProject(proj.id);
        }

        function exportProject() {
            if (!currentProject) return;
            saveToStorage();
            saveShopping();
            const blob = new Blob([JSON.stringify(currentProject, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentProject.emoji}${currentProject.name}_backup.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`已匯出「${currentProject.name}」備份`);
        }

        function importProject(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const proj = JSON.parse(e.target.result);
                    if (!proj.name || !proj.expenses_Chi) { showToast('❌ 無效的行程備份檔'); return; }
                    if (projects.find(p => p.id === proj.id)) proj.id = 'proj_' + Date.now();
                    projects.push(proj);
                    _saveProjectsToStorage();
                    switchProject(proj.id);
                    showToast(`已匯入「${proj.emoji || ''}${proj.name}」`);
                } catch(err) {
                    showToast('❌ 匯入失敗，請確認檔案格式');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

            const data = {
                name,
                emoji: (document.getElementById('projEmoji').value || '✈️').trim(),
                color: _selectedProjectColor || '#4DB8AC',
                destination: (document.getElementById('projDest').value || '').trim(),
                startDate: document.getElementById('projStart').value,
                endDate: document.getElementById('projEnd').value,
            };
            if (isEdit && projectId) {
                const proj = projects.find(p => p.id === projectId);
                if (proj) {
                    Object.assign(proj, data);
                    if (currentProject && currentProject.id === projectId) currentProject = proj;
                    _saveProjectsToStorage();
                    renderProjectList();
                    renderHeaderProject();
                    showToast(`已更新「${data.name}」`);
                }
            } else {
                createProject(data);
            }
            document.getElementById('projectModal').remove();
        }

        function deleteProject(projectId) {
            if (projects.length <= 1) { showToast('❌ 至少保留一個行程'); return; }
            if (!confirm('確定要刪除這個行程？此操作無法復原。')) return;
            projects = projects.filter(p => p.id !== projectId);
            _saveProjectsToStorage();
            document.getElementById('projectModal').remove();
            if (currentProject && currentProject.id === projectId) {
                currentProject = projects[0];
                localStorage.setItem('currentProjectId', currentProject.id);
                loadExpenses(); loadShopping(); loadExchangeRate();
                renderExpenses(); renderShopping();
            }
            renderProjectList();
            renderHeaderProject();
            showToast('已刪除行程');
        }

        // ========== LocalStorage（行程版） ==========

        function saveToStorage() {
            if (!currentProject) return;
            currentProject[`expenses_${currentUser}`] = expenses;
            _saveProjectsToStorage();
        }

        function loadExpenses() {
            expenses = currentProject ? (currentProject[`expenses_${currentUser}`] || []) : [];
        }

        function saveShopping() {
            if (!currentProject) return;
            currentProject[`shopping_${currentUser}`] = shoppingList;
            _saveProjectsToStorage();
        }

        function loadShopping() {
            const raw = currentProject ? (currentProject[`shopping_${currentUser}`] || []) : [];
            shoppingList = raw.map(item => ({
                ...item,
                targetQty: item.targetQty !== undefined ? item.targetQty : 0,
                purchasedQty: item.purchasedQty !== undefined ? item.purchasedQty : 0
            }));
        }

        // 初始化
        init();

        // ========== 下載分帳對帳單 (Excel CSV 格式) ==========

        function downloadSplitStatement(personName) {
            const splitExpenses = expenses.filter(e => 
                e.split && e.splitPeople.includes(personName)
            );
            
            if (splitExpenses.length === 0) {
                showToast('沒有找到分帳記錄');
                return;
            }
            
            // 計算統計資料
            let totalKRW = 0;
            let totalTWD = 0;
            const expenseDetails = [];
            
            splitExpenses.forEach(expense => {
                let personKRW = 0;
                let personTWD = 0;
                let type = '';
                let detail = '';
                
                if (expense.splitMode === 'proxy') {
                    personKRW = expense.krw;
                    personTWD = expense.twd;
                    type = '代購';
                    detail = '代購商品';
                } else if (expense.splitMethod === 'equal') {
                    const totalPeople = expense.splitPeople.length + 1;
                    personKRW = Math.round(expense.krw / totalPeople);
                    personTWD = Math.round(expense.twd / totalPeople);
                    type = '平分';
                    detail = `共${totalPeople}人平分`;
                } else {
                    const alloc = expense.splitAllocations[personName] || { krw: 0, twd: 0 };
                    personKRW = alloc.krw;
                    personTWD = alloc.twd;
                    type = '自訂';
                    detail = '自訂金額';
                }
                
                totalKRW += personKRW;
                totalTWD += personTWD;
                
                expenseDetails.push({
                    datetime: expense.datetime,
                    item: expense.itemName,
                    category: expense.category,
                    krw: personKRW,
                    twd: personTWD,
                    payment: expense.payment,
                    type: type,
                    detail: detail,
                    note: expense.note || '',
                    totalKRW: expense.krw,
                    totalTWD: expense.twd
                });
            });
            
            // 按日期排序
            expenseDetails.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
            
            // 計算總額
            const krwToTWD = Math.round(totalKRW * exchangeRate);
            const totalPayable = krwToTWD + totalTWD;
            const twdToKrw = exchangeRate > 0 ? (1 / exchangeRate).toFixed(2) : '41.67';
            
            // 生成 CSV 內容
            let csvContent = '\uFEFF'; // BOM for UTF-8
            
            // 標題區
            csvContent += '韓國旅行對帳單\n';
            csvContent += `製單人:,${currentUser}\n`;
            csvContent += `對帳對象:,${personName}\n`;
            const now = new Date();
            csvContent += `製單日期:,${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日\n`;
            csvContent += `項目筆數:,${expenseDetails.length} 筆\n`;
            csvContent += `匯率參考:,NT$1 = ₩${twdToKrw}\n`;
            csvContent += '\n';
            
            // 總額摘要
            csvContent += '=== 應付金額摘要 ===\n';
            csvContent += `韓元總計:,₩${Math.round(totalKRW).toLocaleString()}\n`;
            csvContent += `換算台幣:,NT$${krwToTWD.toLocaleString()}\n`;
            csvContent += `台幣總計:,NT$${Math.round(totalTWD).toLocaleString()}\n`;
            csvContent += `應付總額:,NT$${totalPayable.toLocaleString()}\n`;
            csvContent += '\n';
            
            // 明細表頭
            csvContent += '=== 消費明細 ===\n';
            csvContent += '日期,時間,項目,分類,分帳方式,付款方式,你應付(韓元),你應付(台幣),備註\n';
            
            // 明細資料
            expenseDetails.forEach(exp => {
                const date = new Date(exp.datetime);
                const dateStr = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
                const timeStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                let splitInfo = exp.type;
                if (exp.type === '平分') {
                    splitInfo = `${exp.type}(總額₩${exp.totalKRW.toLocaleString()}/NT$${exp.totalTWD.toLocaleString()} ${exp.detail})`;
                }
                
                csvContent += [
                    dateStr,
                    timeStr,
                    `"${exp.item}"`,
                    exp.category,
                    `"${splitInfo}"`,
                    exp.payment,
                    exp.krw,
                    exp.twd,
                    `"${exp.note}"`
                ].join(',') + '\n';
            });
            
            csvContent += '\n';
            csvContent += '備註:此對帳單請核對明細後確認，如有疑問請儘速聯繫\n';
            
            // 下載檔案
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const filename = `韓國旅行對帳單_${personName}_${currentUser}_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast(`✅ ${personName} 的對帳單已下載！`);
        }

        // ========== 下載個人消費清單 ==========

        function downloadMyExpenses() {
            if (expenses.length === 0) {
                showToast('目前沒有消費記錄');
                return;
            }
            
            // 計算總額
            let totalKRW = 0;
            let totalTWD = 0;
            
            expenses.forEach(e => {
                const totalK = Number(e.krw) || 0;
                const totalT = Number(e.twd) || 0;

                if (!e.split || !e.splitPeople || e.splitPeople.length === 0) {
                    totalKRW += totalK;
                    totalTWD += totalT;
                    return;
                }

                const mode = e.splitMode || 'split';
                const method = e.splitMethod || 'equal';

                if (mode === 'split' && method === 'equal') {
                    const denom = (e.splitPeople.length + 1);
                    totalKRW += denom > 0 ? totalK / denom : 0;
                    totalTWD += denom > 0 ? totalT / denom : 0;
                    return;
                }

                const alloc = e.splitAllocations || {};
                let otherKRW = 0;
                let otherTWD = 0;

                e.splitPeople.forEach(p => {
                    const a = alloc[p] || { krw: 0, twd: 0 };
                    otherKRW += Number(a.krw) || 0;
                    otherTWD += Number(a.twd) || 0;
                });

                totalKRW += (totalK - otherKRW);
                totalTWD += (totalT - otherTWD);
            });
            
            // 按分類統計
            const categoryStats = {};
            
            expenses.forEach(e => {
                if (!categoryStats[e.category]) {
                    categoryStats[e.category] = { count: 0, krw: 0, twd: 0 };
                }
                
                categoryStats[e.category].count++;
                
                const totalK = Number(e.krw) || 0;
                const totalT = Number(e.twd) || 0;

                if (!e.split || !e.splitPeople || e.splitPeople.length === 0) {
                    categoryStats[e.category].krw += totalK;
                    categoryStats[e.category].twd += totalT;
                    return;
                }

                const mode = e.splitMode || 'split';
                const method = e.splitMethod || 'equal';

                if (mode === 'split' && method === 'equal') {
                    const denom = (e.splitPeople.length + 1);
                    categoryStats[e.category].krw += denom > 0 ? totalK / denom : 0;
                    categoryStats[e.category].twd += denom > 0 ? totalT / denom : 0;
                    return;
                }

                const alloc = e.splitAllocations || {};
                let otherKRW = 0;
                let otherTWD = 0;

                e.splitPeople.forEach(p => {
                    const a = alloc[p] || { krw: 0, twd: 0 };
                    otherKRW += Number(a.krw) || 0;
                    otherTWD += Number(a.twd) || 0;
                });

                categoryStats[e.category].krw += (totalK - otherKRW);
                categoryStats[e.category].twd += (totalT - otherTWD);
            });
            
            // 生成 CSV
            let csvContent = '\uFEFF'; // BOM for UTF-8
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            
            // 標題區
            csvContent += `${currentUser} 的韓國旅行消費清單\n`;
            csvContent += `製單日期:,${dateStr}\n`;
            csvContent += `總筆數:,${expenses.length} 筆\n`;
            csvContent += '\n';
            
            // 總支出摘要
            csvContent += '=== 總支出摘要 ===\n';
            csvContent += `我的韓元支出(₩):,${Math.round(totalKRW)}\n`;
            csvContent += `我的台幣支出(NT$):,${Math.round(totalTWD)}\n`;
            csvContent += '\n';
            
            // 分類統計
            csvContent += '=== 分類統計 ===\n';
            csvContent += '分類,筆數,韓元(₩),台幣(NT$)\n';
            
            Object.entries(categoryStats).forEach(([category, stats]) => {
                csvContent += `${category},${stats.count},${Math.round(stats.krw)},${Math.round(stats.twd)}\n`;
            });
            
            csvContent += '\n';
            
            // 詳細明細
            csvContent += '=== 消費明細 ===\n';
            csvContent += '日期,時間,項目,分類,總金額(韓元),總金額(台幣),我的負擔(韓元),我的負擔(台幣),付款方式,分帳說明,備註\n';
            
            // 按日期排序
            const sortedExpenses = [...expenses].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
            
            sortedExpenses.forEach(e => {
                const date = new Date(e.datetime);
                const dateStr = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
                const timeStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                // 計算我的負擔
                let myKRW = e.krw;
                let myTWD = e.twd;
                let splitInfo = '無';
                
                if (e.split && e.splitPeople && e.splitPeople.length > 0) {
                    const mode = e.splitMode || 'split';
                    const method = e.splitMethod || 'equal';
                    
                    if (mode === 'proxy') {
                        // 代購：我付全額，但不是我的消費
                        const alloc = e.splitAllocations || {};
                        let otherKRW = 0;
                        let otherTWD = 0;
                        e.splitPeople.forEach(p => {
                            const a = alloc[p] || { krw: 0, twd: 0 };
                            otherKRW += Number(a.krw) || 0;
                            otherTWD += Number(a.twd) || 0;
                        });
                        myKRW = e.krw - otherKRW;
                        myTWD = e.twd - otherTWD;
                        splitInfo = `代購給${e.splitPeople.join(',')}`;
                    } else if (method === 'equal') {
                        // 平分
                        const totalPeople = e.splitPeople.length + 1;
                        myKRW = e.krw / totalPeople;
                        myTWD = e.twd / totalPeople;
                        splitInfo = `與${e.splitPeople.join(',')}平分(共${totalPeople}人)`;
                    } else {
                        // 自訂
                        const alloc = e.splitAllocations || {};
                        let otherKRW = 0;
                        let otherTWD = 0;
                        e.splitPeople.forEach(p => {
                            const a = alloc[p] || { krw: 0, twd: 0 };
                            otherKRW += Number(a.krw) || 0;
                            otherTWD += Number(a.twd) || 0;
                        });
                        myKRW = e.krw - otherKRW;
                        myTWD = e.twd - otherTWD;
                        splitInfo = `與${e.splitPeople.join(',')}自訂分帳`;
                    }
                }
                
                csvContent += [
                    dateStr,
                    timeStr,
                    `"${e.itemName}"`,
                    e.category,
                    Math.round(e.krw),
                    Math.round(e.twd),
                    Math.round(myKRW),
                    Math.round(myTWD),
                    e.payment,
                    `"${splitInfo}"`,
                    `"${e.note || ''}"`
                ].join(',') + '\n';
            });
            
            csvContent += '\n';
            csvContent += '備註:此清單為個人消費記錄,分帳金額已自動計算\n';
            
            // 下載檔案
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const filename = `${currentUser}_韓國旅行消費清單_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast(`✅ 已下載 ${expenses.length} 筆消費記錄！`);
        }

    </script>
</body>
